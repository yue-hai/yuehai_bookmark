[package]
name = "yuehai_bookmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
# Rust 事实上的异步标准运行时（Runtime），提供事件循环、异步 I/O、定时器等底层多线程并发支持
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
# 轻量级 Web 框架，基于 Tower 和 Hyper 构建，支持异步处理请求和响应
axum = { version = "0.8.9", features = ["json"] }
# 轻量级的 HTTP 客户端库，支持异步请求和响应处理
serde = { version = "1.0.229", features = ["derive"] }
# 用于处理 PostgreSQL 数据库的异步库，支持 SQL 查询和事务处理
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "macros", "chrono", "ipnetwork"] }
# sqlx 库的日期时间处理功能，让 SQLx 知道如何在 PostgreSQL 和 Chrono 时间类型之间转换
chrono = { version = "0.4", features = ["serde"] }
# 用于处理环境变量的库，支持从 .env 文件中加载配置，并提供类型安全的访问方式
dotenvy = "0.15"
# 用于处理错误的库，提供了一个简单的方式来定义和处理自定义错误类型
thiserror = "2.0.19"

# 用于处理密码哈希的库，支持 Argon2 算法
argon2 = "0.5"
# 用于生成随机数的库，提供了多种随机数生成器和分布
getrandom = "0.4.3"
# 用于处理 HMAC 的库，支持多种哈希算法
hmac = "0.13"
# 提供 SHA-256 哈希算法
sha2 = "0.11"
